appId: com.example.app
name: "SC-11: Very long email and password input handling"
tags:
  - SCRUM-10
  - edge_case
  - low
---
# Precondition: Launch app fresh and navigate to login screen
- launchApp:
    clearState: true

# Navigate to the login screen
- tapOn: "Login"

# Enter a very long email address (256+ characters)
- tapOn: "Email"
- inputText: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa@example.com"

# Enter a very long password (256+ characters)
- tapOn: "Password"
- inputText: "Pppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppp1!"

# Tap the Login button
- tapOn: "Login"

# Verify: The app handles the long input gracefully without crashing
# We should still be on the login screen or see an error — but NOT a crash
- assertVisible: "Login"
