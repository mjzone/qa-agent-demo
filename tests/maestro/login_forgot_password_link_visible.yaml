appId: com.example.app
name: "SC-04: Forgot Password link is visible at the bottom of the screen"
tags:
  - SCRUM-10
  - positive
  - high
---
# Precondition: Launch app fresh and navigate to login screen
- launchApp:
    clearState: true

# Navigate to the login screen
- tapOn: "Login"

# Verify: The 'Forgot Password' link/text is visible on the login screen
- assertVisible: "Forgot Password"
