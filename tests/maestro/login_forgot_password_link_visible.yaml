appId: com.example.app
name: "SC-04: Forgot Password link is visible at the bottom of the screen"
tags:
  - SCRUM-10
  - positive
  - high
---
# Precondition: Launch app fresh and navigate to login screen
- launchApp:
    clearState: true

# Navigate to the login screen
- tapOn: "Login"

# Scroll down if necessary to reveal the Forgot Password link
- scrollUntilVisible:
    element: "Forgot Password"
    direction: DOWN

# Verify the Forgot Password link is visible
- assertVisible: "Forgot Password"
