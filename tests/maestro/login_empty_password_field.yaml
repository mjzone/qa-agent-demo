appId: com.example.app
name: "SC-08: Login with empty password field only"
tags:
  - SCRUM-10
  - negative
  - medium
---
# Precondition: Launch app fresh and navigate to login screen
- launchApp:
    clearState: true

# Navigate to the login screen
- tapOn: "Login"

# Enter a valid email address
- tapOn: "Email"
- inputText: "test@example.com"

# Leave the password field empty and tap Login
- tapOn: "Login"

# Verify login is not performed - user remains on login screen
# A validation error should indicate password is required
- assertVisible: "Password"
- assertVisible: "Email"
