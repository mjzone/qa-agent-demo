appId: com.example.app
name: "SC-08: Login with valid email but empty password field"
tags:
  - SCRUM-10
  - negative
  - medium
---
# Precondition: Launch app fresh and navigate to login screen
- launchApp:
    clearState: true

# Navigate to the login screen
- tapOn: "Login"

# Enter a valid email address
- tapOn: "Email"
- inputText: "test@example.com"

# Leave the password field empty — do not type in it

# Tap the Login button
- tapOn: "Login"

# Verify: User is NOT navigated to the home screen
# A validation error should be shown or login action is prevented
- assertNotVisible: "Home"

# Verify we are still on the login screen
- assertVisible: "Email"
- assertVisible: "Password"
