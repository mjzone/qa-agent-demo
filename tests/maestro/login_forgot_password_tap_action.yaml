appId: com.example.app
name: "SC-14: Tapping Forgot Password link triggers expected action"
tags:
  - SCRUM-10
  - positive
  - medium
---
# Precondition: Launch app fresh and navigate to login screen
- launchApp:
    clearState: true

# Navigate to the login screen
- tapOn: "Login"

# Scroll to the bottom to find the Forgot Password link
- scrollUntilVisible:
    element: "Forgot Password"
    direction: DOWN

# Tap the Forgot Password link
- tapOn: "Forgot Password"

# Verify user is navigated to a Forgot Password screen or a relevant action is triggered
# The login screen fields should no longer be the primary focus
- assertVisible: "Forgot Password"
- assertNotVisible: "Login"
