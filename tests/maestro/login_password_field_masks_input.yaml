appId: com.example.app
name: "SC-03: Password field masks input with secure text entry"
tags:
  - SCRUM-10
  - positive
  - high
---
# Precondition: Launch app fresh and navigate to login screen
- launchApp:
    clearState: true

# Navigate to the login screen
- tapOn: "Login"

# Tap the password input field
- tapOn: "Password"

# Type a password value
- inputText: "TestPassword123"

# Verify the plain text password is NOT visible on screen
# If secureTextEntry is working, the text "TestPassword123" should not be displayed
- assertNotVisible: "TestPassword123"
