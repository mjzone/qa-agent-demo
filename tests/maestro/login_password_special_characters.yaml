appId: com.example.app
name: "SC-12: Password field handles special characters"
tags:
  - SCRUM-10
  - edge_case
  - low
---
# Precondition: Launch app fresh and navigate to login screen
# Note: This test verifies that special characters are accepted in the password field
- launchApp:
    clearState: true

# Navigate to the login screen
- tapOn: "Login"

# Enter a valid registered email
- tapOn: "Email"
- inputText: "test@example.com"

# Enter a password with special characters
- tapOn: "Password"
- inputText: "P@ss!w0rd#$%"

# Tap the Login button
- tapOn: "Login"

# Verify the app processes the special characters without error
# The app should not crash or reject the input due to special characters
# (Login may fail due to wrong password, but the field should accept the input)
- assertVisible: "Email"
