appId: com.example.app
name: "SC-12: Password field with special characters"
tags:
  - SCRUM-10
  - edge_case
  - low
---
# Precondition: Launch app fresh and navigate to login screen
# Note: This test assumes a registered account with special character password exists
- launchApp:
    clearState: true

# Navigate to the login screen
- tapOn: "Login"

# Enter the registered email address
- tapOn: "Email"
- inputText: "test@example.com"

# Enter a password containing special characters
- tapOn: "Password"
- inputText: "Test1234!"

# Tap the Login button
- tapOn: "Login"

# Verify login succeeds and user is navigated to the home screen
# Special characters in the password are handled correctly
- assertVisible: "Home"
