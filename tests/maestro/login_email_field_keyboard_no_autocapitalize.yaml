appId: com.example.app
name: "SC-02: Email field uses email keyboard and does not auto-capitalize"
tags:
  - SCRUM-10
  - positive
  - high
---
# Precondition: Launch app fresh and navigate to login screen
- launchApp:
    clearState: true

# Navigate to the login screen
- tapOn: "Login"

# Tap the email input field to activate it
- tapOn: "Email"

# Type a lowercase letter to verify no auto-capitalization occurs
- inputText: "testuser@example.com"

# Verify: The email field contains the text exactly as typed (lowercase, no auto-capitalize)
# Maestro cannot directly assert keyboard type, but we verify the input remains lowercase
- assertVisible: "testuser@example.com"
