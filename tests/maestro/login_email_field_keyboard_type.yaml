appId: com.example.app
name: "SC-02: Email field uses email keyboard and does not auto-capitalize"
tags:
  - SCRUM-10
  - positive
  - high
---
# Precondition: Launch app fresh and navigate to login screen
- launchApp:
    clearState: true

# Navigate to the login screen
- tapOn: "Login"

# Tap the email input field to bring up the keyboard
- tapOn: "Email"

# Type a lowercase letter to verify no auto-capitalization occurs
- inputText: "lowercase@test.com"

# Verify the email field contains the lowercase text as typed (no auto-capitalization)
# The field should retain lowercase input without modifying it
- assertVisible: "lowercase@test.com"
