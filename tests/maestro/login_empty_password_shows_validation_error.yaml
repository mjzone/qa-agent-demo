appId: com.example.app
name: "SC-08: Login with empty password field shows validation error"
tags:
  - SCRUM-10
  - negative
  - medium
---
# Precondition: Launch app fresh and navigate to login screen
- launchApp:
    clearState: true

# Navigate to the login screen
- tapOn: "Login"

# Enter a valid email but leave password empty
- tapOn: "Email"
- inputText: "validuser@example.com"

# Tap the Login button without entering a password
- tapOn: "Login"

# Verify a validation error is shown for the password field
- assertVisible: "required"

# Verify user remains on the login screen
- assertVisible: "Email"
- assertVisible: "Password"
