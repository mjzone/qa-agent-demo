appId: com.example.app
name: "SC-13: Forgot Password link is tappable and navigates appropriately"
tags:
  - SCRUM-10
  - positive
  - medium
---
# Precondition: Launch app fresh and navigate to login screen
- launchApp:
    clearState: true

# Navigate to the login screen
- tapOn: "Login"

# Verify the Forgot Password link is visible
- assertVisible: "Forgot Password"

# Tap the Forgot Password link
- tapOn: "Forgot Password"

# Verify: The app navigates to a forgot password screen or triggers a forgot password flow
# The login screen elements should no longer be the primary view
- assertNotVisible: "Login"
