appId: com.example.app
name: "SC-01: Login with valid credentials navigates to home screen"
tags:
  - SCRUM-10
  - smoke
  - high
---
# Precondition: Launch app fresh and navigate to login screen
- launchApp:
    clearState: true

# Navigate to the login screen (from welcome/landing screen)
- tapOn: "Login"

# Enter valid registered email address
- tapOn: "Email"
- inputText: "test@example.com"

# Enter correct password
- tapOn: "Password"
- inputText: "Test1234!"

# Tap the Login button to authenticate
- tapOn: "Login"

# Verify user is navigated to the home screen successfully
- assertVisible: "Home"
