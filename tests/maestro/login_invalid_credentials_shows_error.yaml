appId: com.example.app
name: "SC-06: Login with invalid credentials shows error message"
tags:
  - SCRUM-10
  - negative
  - high
---
# Precondition: Launch app fresh and navigate to login screen
- launchApp:
    clearState: true

# Navigate to the login screen
- tapOn: "Login"

# Enter a valid email format but unregistered/wrong credentials
- tapOn: "Email"
- inputText: "wrong@example.com"

# Enter an incorrect password
- tapOn: "Password"
- inputText: "WrongPass999"

# Tap the Login button
- tapOn: "Login"

# Verify an error message is displayed indicating invalid credentials
- assertVisible: "Invalid"

# Verify user remains on the login screen
- assertVisible: "Email"
- assertVisible: "Password"
