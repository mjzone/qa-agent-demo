appId: com.example.app
name: "SC-06: Login with invalid credentials shows error"
tags:
  - SCRUM-10
  - negative
  - high
---
# Precondition: Launch app fresh and navigate to login screen
- launchApp:
    clearState: true

# Navigate to the login screen
- tapOn: "Login"

# Enter an invalid/unregistered email address
- tapOn: "Email"
- inputText: "invalid@example.com"

# Enter an incorrect password
- tapOn: "Password"
- inputText: "WrongPassword123"

# Tap the Login button
- tapOn: "Login"

# Verify: User is NOT navigated to the home screen
# An error message or indication should be displayed
- assertNotVisible: "Home"
