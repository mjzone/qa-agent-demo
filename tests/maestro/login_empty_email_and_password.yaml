appId: com.example.app
name: "SC-07: Login with empty email and password fields"
tags:
  - SCRUM-10
  - negative
  - high
---
# Precondition: Launch app fresh and navigate to login screen
- launchApp:
    clearState: true

# Navigate to the login screen
- tapOn: "Login"

# Verify both fields are empty (do not type anything)
# Tap the Login button without entering any data
- tapOn: "Login"

# Verify login is not performed - user remains on login screen
# Either a validation error is shown or the button does nothing
- assertVisible: "Email"
- assertVisible: "Password"
