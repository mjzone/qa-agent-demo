appId: com.example.app
name: "SC-07: Login with empty email and password fields"
tags:
  - SCRUM-10
  - negative
  - medium
---
# Precondition: Launch app fresh and navigate to login screen
- launchApp:
    clearState: true

# Navigate to the login screen
- tapOn: "Login"

# Leave both email and password fields empty — do not tap or type in them

# Tap the Login button without entering any credentials
- tapOn: "Login"

# Verify: User is NOT navigated to the home screen
# The app should show a validation error or prevent login
- assertNotVisible: "Home"

# Verify we are still on the login screen
- assertVisible: "Email"
- assertVisible: "Password"
